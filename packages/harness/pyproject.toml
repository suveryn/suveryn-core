[project]
name = "suveryn-harness"
version = "0.1.0"
description = "Sūveryn harness: what the model is given, how it is called, and how its answer is checked (docs/harness.md)"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
dependencies = [
    "httpx>=0.27",
    "anyio>=4",  # shielding the usage record when a streamed answer is stopped (llm.stream)
    "pydantic>=2.8",
    "suveryn-playbooks",  # the playbooks' instructions and facts (facts.py)
]

[tool.uv.sources]
suveryn-playbooks = { workspace = true }

[project.urls]
Homepage = "https://github.com/suveryn/suveryn-core"
Repository = "https://github.com/suveryn/suveryn-core"
Documentation = "https://github.com/suveryn/suveryn-docs"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/suveryn_harness"]
