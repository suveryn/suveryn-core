[project]
name = "suveryn-playbooks"
version = "0.1.0"
description = "Sūveryn playbooks: the official playbooks as manifest files (identity, facts, instructions) and their loader; no runtime"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
dependencies = [
    "pydantic>=2.8",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/suveryn/suveryn-core"
Repository = "https://github.com/suveryn/suveryn-core"
Documentation = "https://github.com/suveryn/suveryn-docs"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/suveryn_playbooks"]
