[project]
name = "suveryn-playbooks"
version = "0.1.0"
description = "Sūveryn playbooks: the official, hand-built playbooks (content: fields, instructions, identity); no runtime"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
dependencies = []

[project.urls]
Homepage = "https://github.com/suveryn/suveryn-core"
Repository = "https://github.com/suveryn/suveryn-core"
Documentation = "https://github.com/suveryn/suveryn-docs"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/suveryn_playbooks"]
