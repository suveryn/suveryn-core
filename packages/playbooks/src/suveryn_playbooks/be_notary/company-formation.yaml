# Company formation: the incorporation of a Belgian BV (docs/design/playbooks.md).
#
# The facts the deed of incorporation needs, read from what the founders sent (identity documents,
# the financial plan, the bank certificate, proof of the registered office, the founders' own notes)
# and checked by a person at the checkpoint. Fourteen facts, one of them a list: the founders, one
# entry each with their name, their shares and their contribution (format 3), so a deed with three
# founders is three entries the notary checks one by one, and the number of shares is a number the
# check compares with the passage. Every fact is a line of the deed the notary has to check.
#
# The routine (format 2): ask for the founders' documents, read them, ask about what was not found,
# the checkpoint, the summary. The words per language are in text/<lang>.json beside this file; the
# answer's shape the model is held to is the runtime's, appended by the loader.
#
# 1.0 (November 2026): the first version: one request, one read.
# 1.1 (November 2026): the documents by name (format 3, "Documents by name"): the identity documents, the
# financial plan and the bank certificate are asked for as such, and each read is aimed at its own;
# the founders carry their identity (register number, birth, address: decided 3 November, read and kept
# like any fact); the bank certificate may be absent (a contribution in kind), and then its read is
# skipped and the ask step asks. The instructions ask for the JSON object the loader describes.
# 1.2 (November 2026): the checks (format 3, "Checks"), computed by the server on the values as they
# stand and shown at the checkpoint, never a block: the founders' shares add up to the shares issued,
# their contributions to the contribution in money, the bank certifies that amount, there is at least
# one founder.
# 1.3 (November 2026): the contribution's kind is a choice (format 3, "Choices"): cash, in kind or mixed,
# read from the plan or asked. The bank certificate is asked for and read, and the bank's check runs,
# only when there is money; the auditor's and founders' reports are asked for and read only when there
# is a contribution in kind; a skipped step says why in the thread.
# 1.4 (November 2026): the case manager confirms (by: manager): a clerk prepares and corrects, the notary,
# who manages the case, passes the checkpoint. The case's roles, no other (decided 3 November).

manifest: 3
id: playbook/be-notary/company-formation
pack: pack/be-notary
version: "1.4"
name: Company formation
case_types: [company-formation]

facts:
  - id: founders
    ask: the founders, one entry per founder (a person or a company)
    kind: list
    of:
      - id: name
        ask: "the founder's full name as written, or for a company its name"
      - id: register_number
        ask: "the founder's national register number, or for a company its enterprise number"
      - id: born
        ask: "the founder's date and place of birth; for a company its legal form and registered office"
      - id: address
        ask: the founder's address as written on the identity document or the company's extract
      - id: shares
        ask: the number of shares this founder takes
        kind: number
      - id: contribution
        ask: this founder's contribution in money
        kind: amount
  - id: company_name
    ask: the name of the company as it will appear in the deed, and any trade name it will use
  - id: seat
    ask: "the registered office: the full address"
  - id: object
    ask: "the object of the company: the main activities it will carry out, as the founders describe them"
  - id: contribution_kind
    ask: "how the founders contribute: cash (money only), in_kind (goods, rights or work only) or mixed (both)"
    kind: choice
    options: [cash, in_kind, mixed]
  - id: contribution
    ask: the total contribution in money by the founders
    kind: amount
  - id: contribution_in_kind
    ask: "the contribution in kind: what is contributed (goods, rights, work) and by whom"
  - id: in_kind_value
    ask: the value given to the contribution in kind in the founders' report
    kind: amount
  - id: auditor
    ask: "the auditor (bedrijfsrevisor) who reported on the contribution in kind: name and the date of the report"
  - id: shares
    ask: the total number of shares issued
    kind: number
  - id: directors
    ask: "the director or directors appointed in the deed: full names as written, and whether the mandate is paid or unpaid"
  - id: representation
    ask: "how the company is represented towards third parties: one director alone, two directors jointly, or another rule"
  - id: fiscal_year
    ask: the closing date of the financial year, and the closing date of the first financial year if it is longer or shorter than a year
  - id: general_meeting
    ask: the day and hour of the annual general meeting
  - id: plan_date
    ask: the date of the financial plan handed to the notary
    kind: date
  - id: financial_plan
    ask: "the financial plan: who drafted it, the external expert named in it if any, and the period it covers"
  - id: bank_certificate
    ask: "the bank certificate for the contribution in money: the bank, the blocked account, the amount and the certificate's date"
  - id: certified_amount
    ask: the amount the bank certifies as paid into the blocked account
    kind: amount

instructions: >-
  You are preparing the incorporation of a Belgian private limited company (BV/SRL) for a notarial
  deed. Read the excerpts and give every fact below as the documents write it (names, amounts,
  dates, addresses, references), with the numbers of the excerpts the value comes from. A fact the
  excerpts do not contain is null: never guess, never fill in from general knowledge, and never
  supply a value the law would suggest. Answer in the language of the documents.

steps:
  - id: identity          # the founders' identity documents, or a company's extract from the register
    kind: request
    expects: identity_documents
    min: 1
  - id: founders_read
    kind: read
    documents: [identity_documents]
    facts: [founders]
  - id: plan              # the financial plan and what the founders decided (name, seat, object, shares, directors)
    kind: request
    expects: financial_plan
    min: 1
  - id: plan_read
    kind: read
    documents: [financial_plan]
    facts: [company_name, seat, object, contribution_kind, contribution, shares, directors, representation,
            fiscal_year, general_meeting, plan_date, financial_plan]
  - id: kind_known        # the plan may not say how the founders contribute: ask before the branches
    kind: ask
    facts: [contribution_kind]
  - id: bank              # the bank's certificate of the blocked account: only when there is money
    kind: request
    expects: bank_certificate
    min: 1
    when: contribution_kind != in_kind
  - id: bank_read
    kind: read
    documents: [bank_certificate]
    facts: [bank_certificate, certified_amount]
    when: contribution_kind != in_kind
  - id: reports           # the auditor's and the founders' reports: only when something is contributed in kind
    kind: request
    expects: contribution_reports
    min: 1
    when: contribution_kind != cash
  - id: reports_read
    kind: read
    documents: [contribution_reports]
    facts: [contribution_in_kind, in_kind_value, auditor]
    when: contribution_kind != cash
  - id: missing           # one question per fact the documents did not contain
    kind: ask
    facts: all
  - id: shares_add_up     # the checks: what the notary would add up by hand; a failed one is a point to look at
    kind: check
    rule: sum(founders.shares) == shares
  - id: contributions_add_up
    kind: check
    rule: sum(founders.contribution) == contribution
    when: contribution_kind != in_kind
  - id: bank_certifies_the_contribution
    kind: check
    rule: certified_amount == contribution
    when: contribution_kind != in_kind
  - id: a_founder
    kind: check
    rule: "count(founders) >= 1"
  - id: confirm
    kind: checkpoint
    by: manager           # the notary manages the case; a clerk prepares and corrects, the notary confirms
  - id: summary
    kind: produce
    template: summary
