# Deed intake for a Belgian sale (docs/design/playbooks.md).
#
# The facts a notarial deed of sale needs, read from the case's uploaded documents (the private sale
# agreement, the earlier title deed, the certificates) and checked by a person at the checkpoint.
# Thirteen facts, no more: every fact is a line the notary has to check.
#
# The routine (format 2): ask for the agreement, read the documents, ask about what was not found,
# the checkpoint, the summary. The questions' words and the labels per language are in
# text/<lang>.json beside this file; the table the model fills in is the runtime's, appended by the loader.
#
# 1.1 (October 2026): the routine. The facts, the instructions and the summary are 1.0's.

manifest: 2
id: playbook/be-notary/deed-intake
pack: pack/be-notary
version: "1.1"
name: Deed intake
case_types: [sale]

facts:
  - id: sellers
    ask: the selling party or parties, as named in the agreement (full names as written)
  - id: buyers
    ask: the buying party or parties (full names as written)
  - id: property
    ask: "the property sold: its address and description"
  - id: cadastral
    ask: "the cadastral identification of the property: municipality, division, section, number"
  - id: price
    ask: the sale price
    kind: amount
  - id: deposit
    ask: the advance or guarantee paid at signing, and to whom it was paid
    kind: amount
  - id: agreement_date
    ask: the date the private agreement was signed
    kind: date
  - id: deed_deadline
    ask: the date by which the notarial deed must be signed
    kind: date
  - id: conditions
    ask: the suspensive conditions (financing, permits, other), each with its term
  - id: title
    ask: "the seller's title: the earlier deed, its date and the notary who passed it"
  - id: epc
    ask: "the energy performance certificate: its reference and result"
  - id: soil
    ask: "the soil certificate: its reference and conclusion"
  - id: occupancy
    ask: "the occupancy at delivery: free, let or occupied, and by whom"

instructions: >-
  You are preparing the intake of a sale for a notarial deed. Read the excerpts and fill in the
  table below: one row per fact, in this order, with the fact's id in the first column exactly as
  given, the value in the second column, copied as the documents write it (names, amounts, dates,
  references), and in the third column the excerpt numbers the value comes from, as [n]. A fact
  the excerpts do not contain gets an empty second column and an empty third column: never guess,
  never fill in from general knowledge. Answer with the table only, no text before or after it,
  in the language of the documents.

steps:
  - id: agreement          # the signed sale agreement and what the parties sent
    kind: request
    min: 1
  - id: read
    kind: read
    facts: all
  - id: missing            # one question per fact the documents did not contain
    kind: ask
    facts: all
  - id: confirm
    kind: checkpoint
    by: anyone_in_case
  - id: summary
    kind: produce
    template: summary
