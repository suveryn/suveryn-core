# Deed intake for a Belgian sale (docs/design/playbooks.md).
#
# The facts a notarial deed of sale needs, read from the case's uploaded documents (the private sale
# agreement, the earlier title deed, the certificates) and checked by a person at the checkpoint.
# Every fact is a line the notary has to check; the parties and the conditions are lists, one entry
# each, so a second seller is a second entry and not a longer sentence.
#
# The routine: ask for the agreement, the title deed and the certificates, read each fact from the documents
# that state it, ask about what was not found, the checks,
# the checkpoint, the summary. The questions' words and the labels per language are in
# text/<lang>.json beside this file; the shape the model fills in is the runtime's, appended by the loader.
#
# 1.1 (October 2026): the routine. The facts, the instructions and the summary are 1.0's.
# 1.2 (November 2026): the answer is JSON of the facts' shape (format 3), held to by the model server;
# the facts and the words are 1.0's, the instructions say "the object" where they said "the table".
# 1.3 (November 2026): the sellers, the buyers and the suspensive conditions are lists (a party's name,
# address and register number; a condition and its term), and five checks the server computes for the
# checkpoint: a seller and a buyer, the advance within the price, the deed after the agreement, every
# condition's term before the deed. The questions and the labels of 1.0 are unchanged; the lists' fields
# and the checks have words of their own.
# 1.4 (November 2026): the deed's deadline and a condition's term count from the agreement's date when the
# agreement gives a term instead of a date ("within four months of the signing"): sūveryn works the date out
# and says how, and a person checks it (board P01). The facts, the instructions and the words are 1.3's.
# 1.5 (November 2026): the documents by name (format 3, "Documents by name"): the sale agreement, the seller's
# title deed and the certificates are asked for as such, and each fact is read from the documents that state
# it. The GPU round's sale file of real length (10 November) found why: read all at once, a 25-page title deed
# of an earlier sale filled the reading, and the parties and the price of today's agreement were not seen. The
# facts, the instructions and the checks are 1.4's.

manifest: 3
id: playbook/be-notary/deed-intake
pack: pack/be-notary
version: "1.5"
name: Deed intake
case_types: [sale]

facts:
  - id: sellers
    ask: the selling party or parties, one entry per seller, as named in the agreement
    kind: list
    of:
      - id: name
        ask: the seller's full name as written (a company's name as written)
      - id: address
        ask: the seller's address as written
      - id: register
        ask: the seller's national register number (a company's enterprise number), as written
  - id: buyers
    ask: the buying party or parties, one entry per buyer
    kind: list
    of:
      - id: name
        ask: the buyer's full name as written (a company's name as written)
      - id: address
        ask: the buyer's address as written
      - id: register
        ask: the buyer's national register number (a company's enterprise number), as written
  - id: property
    ask: "the property sold: its address and description"
  - id: cadastral
    ask: "the cadastral identification of the property: municipality, division, section, number"
  - id: price
    ask: the sale price
    kind: amount
  - id: deposit
    ask: the advance or guarantee paid at signing, and to whom it was paid
    kind: amount
  - id: agreement_date
    ask: the date the private agreement was signed
    kind: date
  - id: deed_deadline
    ask: the date by which the notarial deed must be signed
    kind: date
    counts_from: agreement_date
  - id: conditions
    ask: the suspensive conditions (financing, permits, other), one entry per condition
    kind: list
    of:
      - id: condition
        ask: the condition as written
      - id: term
        ask: the date by which the condition must be met, as the agreement writes it
        kind: date
        counts_from: agreement_date
  - id: title
    ask: "the seller's title: the earlier deed, its date and the notary who passed it"
  - id: epc
    ask: "the energy performance certificate: its reference and result"
  - id: soil
    ask: "the soil certificate: its reference and conclusion"
  - id: occupancy
    ask: "the occupancy at delivery: free, let or occupied, and by whom"

instructions: >-
  You are preparing the intake of a sale for a notarial deed. Read the excerpts and give every fact
  below as the documents write it (names, amounts, dates, references), with the numbers of the
  excerpts the value comes from. A fact the excerpts do not contain is null: never guess, never fill
  in from general knowledge. Answer in the language of the documents.

steps:
  - id: agreement          # the signed sale agreement: the parties, the property, the price, the dates
    kind: request
    expects: sale_agreement
    min: 1
  - id: title_deed         # the seller's title: the earlier deed by which the seller acquired the property
    kind: request
    expects: title_deed
    min: 1
    allow_none: true
  - id: certificates       # the energy performance certificate, the soil certificate
    kind: request
    expects: certificates
    min: 1
    allow_none: true
  - id: agreement_read     # today's sale, from today's agreement only: an earlier deed names other parties
    kind: read
    documents: [sale_agreement]
    facts: [sellers, buyers, property, cadastral, price, deposit, agreement_date, deed_deadline, conditions, occupancy]
  - id: title_read         # the seller's title: the agreement says where it comes from, the title deed in full
    kind: read
    documents: [sale_agreement, title_deed]
    facts: [title]
  - id: certificates_read  # the certificates, or the agreement's lines about them
    kind: read
    documents: [certificates, sale_agreement]
    facts: [epc, soil]
  - id: missing            # one question per fact the documents did not contain
    kind: ask
    facts: all
  - id: a_seller
    kind: check
    rule: "count(sellers) >= 1"
  - id: a_buyer
    kind: check
    rule: "count(buyers) >= 1"
  - id: deposit_within_price
    kind: check
    rule: deposit <= price
  - id: deed_after_agreement
    kind: check
    rule: agreement_date < deed_deadline
  - id: conditions_before_deed
    kind: check
    rule: latest(conditions.term) <= deed_deadline
  - id: confirm
    kind: checkpoint
    by: anyone_in_case
  - id: summary
    kind: produce
    template: summary
