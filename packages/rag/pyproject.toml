[project]
name = "suveryn-rag"
version = "0.1.0"
description = "Sūveryn RAG: document extraction (ocr_fast), chunking, embeddings, pgvector store and retrieval"
requires-python = ">=3.12"
dependencies = [
    "suveryn-engine",
    "docling>=2.40",
    "ocrmypdf>=16.0",
    "pypdfium2>=4.30",
    "sentence-transformers>=3.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
]

[project.scripts]
suveryn-ingest = "suveryn_rag.cli:ingest_main"
suveryn-retrieve = "suveryn_rag.cli:retrieve_main"
suveryn-forget = "suveryn_rag.cli:forget_main"

[tool.uv.sources]
suveryn-engine = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/suveryn_rag"]
