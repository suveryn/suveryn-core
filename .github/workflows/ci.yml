name: CI

on:
  push:
    branches: [main]
  pull_request:
    # labeled: the label "remake the baselines" has the previews job take the screens' baselines on the
    # runner and commit them to the branch (the previews job below); the other jobs sit that event out.
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:   # the previews job starts CI again by name after it commits the baselines
  schedule:
    - cron: "17 5 * * 1"   # Mondays, for the dependency audit

jobs:
  markdown:
    name: Markdown lint
    if: github.event.action != 'labeled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: markdownlint-cli2 (the rules in .markdownlint-cli2.jsonc)
        # Pinned, so a new release can't fail a pull request that changed nothing. The docs drifted
        # unnoticed in this repository while suveryn-docs and the handbook already ran it.
        run: npx --yes markdownlint-cli2@0.23.2 "**/*.md"

  lint:
    name: Python workspace (lint)
    if: github.event.action != 'labeled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Ruff (pyflakes rules and syntax errors)
        # Unused imports and variables, undefined names, and code that doesn't parse: the leftovers a
        # review keeps finding by hand (external review, pass 8). Pinned, so a new ruff release can't
        # fail a pull request that changed nothing. Style rules stay off: the house style is the docs'.
        run: uvx ruff@0.16.8 check --select F,E9 --output-format github .

  python:
    name: Python workspace (pytest)
    if: github.event.action != 'labeled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Sync workspace
        run: uv sync --all-packages --dev

      - name: Unit tests
        # Tests that need a real database or a running model skip themselves
        # (SUVERYN_TEST_DATABASE_URL unset) — see the db-tests job below, and
        # packages/rag/tests/test_answers_e2e.py's own docstring for the
        # model-regression suite, which runs by hand on a GPU machine.
        run: uv run pytest -q

  db-tests:
    name: Python workspace (Postgres-backed tests)
    if: github.event.action != 'labeled'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: suveryn_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - run: uv python install 3.12
      - run: uv sync --all-packages --dev

      - name: Tests against a real Postgres
        env:
          SUVERYN_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/suveryn_test
        # test_e2e.py needs the reader's models: it runs in e2e.yml's reader job, on the CPU.
        # test_answers_e2e.py and test_playbook_reads_e2e.py ask a real model: scripts/gpu-round.sh, on a GPU machine.
        run: >
          uv run pytest -q
          --ignore=packages/rag/tests/test_e2e.py
          --ignore=packages/rag/tests/test_answers_e2e.py
          --ignore=packages/rag/tests/test_playbook_reads_e2e.py

  chat-ui:
    name: chat-ui (typecheck, test, build)
    if: github.event.action != 'labeled'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/chat-ui
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: packages/chat-ui/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  previews:
    name: chat-ui (the screens against their baselines)
    # Every preview and setup screen photographed and compared with src/preview/baseline/: a screen that
    # drifts from its design board fails here, with the new shot and the diff as an artifact
    # (packages/chat-ui/scripts/previews-shoot.mjs; the README's "Screen previews").
    #
    # A screenshot depends on the machine that takes it (its browser build, fonts, text rendering), so a
    # baseline is made here and nowhere else: the label "remake the baselines" on a pull request, once its
    # screens agree with their design boards, has this job take them all, commit src/preview/baseline/ to the
    # branch, drop the label and start CI again.
    #
    # Pinned: the runner moves only with the baselines; ubuntu-latest (26.04) has no Chromium for Playwright.
    runs-on: ubuntu-24.04
    if: github.event.action != 'labeled' || github.event.label.name == 'remake the baselines'
    permissions:
      contents: write
      pull-requests: write
      actions: write
    defaults:
      run:
        working-directory: packages/chat-ui
    steps:
      - uses: actions/checkout@v5
        with:
          # The branch itself when the baselines are to be committed to it; otherwise the usual merge commit.
          ref: ${{ github.event.action == 'labeled' && github.event.pull_request.head.ref || '' }}

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: packages/chat-ui/package-lock.json

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: The screens against their baselines
        if: github.event.action != 'labeled'
        run: npm run previews:check

      - name: The changed screens, for the review
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: previews
          path: packages/chat-ui/.previews/
          include-hidden-files: true   # .previews is a hidden folder, which the action skips by default
          if-no-files-found: ignore

      - name: The baselines, remade on the runner and committed to the branch
        if: github.event.action == 'labeled'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          npm run previews:update
          gh pr edit "$PR" --remove-label "remake the baselines"
          git add src/preview/baseline
          if git diff --cached --quiet; then
            echo "The baselines already match the screens; nothing to commit."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Screens: the baselines, remade on the runner" \
            -m "Taken by CI's previews job on $BRANCH (the label \"remake the baselines\" on #$PR, run ${{ github.run_id }})."
          git push origin "HEAD:$BRANCH"
          # A push with the workflow's own token starts no workflow, so CI is asked for by name. That needs
          # workflow_dispatch in main's ci.yml; until it is there (the first time), a push to the branch does it.
          gh workflow run ci.yml --ref "$BRANCH" \
            || echo "::warning::CI could not be started by name (main's ci.yml has no workflow_dispatch yet); push to the branch to run it."

  dependencies:
    name: Known vulnerabilities in the locked dependencies
    if: github.event.action != 'labeled'
    # Every push, and weekly, since an advisory can be published against a lock that hasn't changed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Python (pip-audit over uv.lock; exceptions with their reason in .github/scripts/dependency_audit.py)
        run: |
          uv export --all-packages --no-dev --no-hashes --format requirements-txt -q | grep -v '^-e\|^\./' > reqs.txt
          # pip-audit exits 1 whenever it finds anything; the script below decides. A run that wrote no report fails here.
          uvx pip-audit -r reqs.txt --no-deps --disable-pip --progress-spinner off --format json -o audit.json || test -s audit.json
          python3 .github/scripts/dependency_audit.py audit.json

      - name: Chat UI (npm audit, what ships to the browser)
        working-directory: packages/chat-ui
        run: npm audit --omit=dev --audit-level=high
