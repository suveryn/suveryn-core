name: End to end

# The walk-through and the lifecycle scenarios (e2e/README.md): the gateway, the chat UI, Keycloak and PostgreSQL
# together, a stand-in model server, a browser. What a VM regression round did by hand, on every pull request.
# Beside it, the reader on its own: the trap deed in four forms through the real Docling, OCR and embedder.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e:
    name: Walk-through and lifecycle (browser, real services, stand-in model)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: System packages for the document reader
        # OCRmyPDF with Dutch, French and English Tesseract, Ghostscript and Poppler: what the appliance's
        # provisioning installs for suveryn-rag's extraction.
        # A hung mirror once kept this step waiting until the job's 45 minutes ran out, and later a download
        # stalled without a word (run 42281173931): each apt call has a time limit, apt's own retries, IPv4
        # only and a limit on waiting for the package lock, prints its progress (-q, not -qq) so a stall shows
        # where it is, and the whole step is tried three times before it fails.
        timeout-minutes: 25
        run: |
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::ForceIPv4=true -o DPkg::Lock::Timeout=120"
          for attempt in 1 2 3; do
            if timeout 120 sudo apt-get $APT update -q \
               && timeout 360 sudo DEBIAN_FRONTEND=noninteractive apt-get $APT install -y -q ocrmypdf tesseract-ocr-nld tesseract-ocr-fra tesseract-ocr-eng ghostscript poppler-utils postgresql-client; then
              exit 0
            fi
            echo "::warning::apt attempt $attempt failed or hung; trying again in 15 s"
            sleep 15
          done
          exit 1

      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - run: uv python install 3.12
      - run: uv sync --all-packages --dev --group e2e

      - name: Browser for Playwright
        run: uv run playwright install --with-deps chromium

      - name: Model files for the reader and the embedder (cached)
        # bge-m3 and Docling's layout models, fetched below; cached between runs so a run downloads them once.
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-bge-m3-docling-${{ hashFiles('uv.lock') }}
          restore-keys: hf-${{ runner.os }}-bge-m3-docling-

      - name: Fetch the models, as an appliance does at set-up
        # The gateway never downloads at runtime (suveryn_rag.offline): without this the reader and the
        # embedder find an empty cache and document handling fails to start. On a warm cache this is seconds.
        env:
          SUVERYN_RAG_DEVICE: cpu
        run: uv run suveryn-fetch-models

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: packages/chat-ui/package-lock.json
      - name: Build the chat UI
        working-directory: packages/chat-ui
        run: npm ci && npm run build

      - name: Start the stack
        env:
          E2E_SERVICES: docker
        run: uv run python e2e/stack.py up

      - name: Scenarios
        env:
          E2E_SERVICES: docker
        # the walk-through first, then the scenarios that stop services under it
        run: uv run pytest e2e/tests/test_stub_contract.py e2e/tests/test_walkthrough.py e2e/tests/test_lifecycle.py -p no:cacheprovider -v

      - name: Logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-run
          path: |
            e2e/.run/*.log
            e2e/.run/shots/
          if-no-files-found: ignore
          include-hidden-files: true   # .run/ is a dot-folder
          retention-days: 7

      - name: Stop the stack
        if: always()
        env:
          E2E_SERVICES: docker
        run: uv run python e2e/stack.py down

  reader:
    name: The reader on the trap deed (real Docling, OCR and embedder, CPU)
    # packages/rag/tests/test_e2e.py: the trap deed born-digital, scanned, scanned under a thin text layer and
    # scanned and signed, read, OCR'd, chunked, embedded and searched, against the quality bar in its docstring.
    # It needs no language model, so a CPU does: it catches a reader regression (a Docling or OCRmyPDF upgrade)
    # on the pull request that brings it, instead of on the GPU machine later. test_answers_e2e.py, which asks
    # a real model, stays on the GPU machine.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: suveryn_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v5

      - name: System packages for the document reader
        # A hung mirror once kept this step waiting until the job's 45 minutes ran out, and later a download
        # stalled without a word (run 42281173931): each apt call has a time limit, apt's own retries, IPv4
        # only and a limit on waiting for the package lock, prints its progress (-q, not -qq) so a stall shows
        # where it is, and the whole step is tried three times before it fails.
        timeout-minutes: 25
        run: |
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::ForceIPv4=true -o DPkg::Lock::Timeout=120"
          for attempt in 1 2 3; do
            if timeout 120 sudo apt-get $APT update -q \
               && timeout 360 sudo DEBIAN_FRONTEND=noninteractive apt-get $APT install -y -q ocrmypdf tesseract-ocr-nld tesseract-ocr-fra tesseract-ocr-eng ghostscript poppler-utils; then
              exit 0
            fi
            echo "::warning::apt attempt $attempt failed or hung; trying again in 15 s"
            sleep 15
          done
          exit 1

      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - run: uv python install 3.12
      - run: uv sync --all-packages --dev

      - name: Model files for the reader and the embedder (cached, shared with the walk-through)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-bge-m3-docling-${{ hashFiles('uv.lock') }}
          restore-keys: hf-${{ runner.os }}-bge-m3-docling-

      - name: Fetch the models, as an appliance does at set-up
        env:
          SUVERYN_RAG_DEVICE: cpu
        run: uv run suveryn-fetch-models

      - name: The trap deed, four ways
        env:
          SUVERYN_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/suveryn_test
          SUVERYN_RAG_DEVICE: cpu
          SUVERYN_OCR_JOBS: "2"
          SUVERYN_EXTRACT_UNSANDBOXED: "1"   # no sandbox wrapper on a CI runner (the appliance has one)
        run: uv run pytest packages/rag/tests/test_e2e.py -v -rs -p no:cacheprovider --junitxml=reader.xml

      - name: All four were read, none skipped
        # The test skips itself without Docling, reportlab, Poppler or a database; here that would pass without
        # having read anything.
        if: always()
        run: |
          python3 - <<'PY'
          import sys, xml.etree.ElementTree as ET
          suite = ET.parse("reader.xml").getroot().find("testsuite")
          tests, skipped = int(suite.get("tests")), int(suite.get("skipped"))
          print(f"{tests} tests, {skipped} skipped")
          sys.exit(0 if tests >= 4 and skipped == 0 else 1)
          PY
