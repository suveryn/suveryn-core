[project]
name = "suveryn-core"
version = "0.1.0"
description = "Sūveryn core: engine, chat, RAG, MCP host and API gateway (uv workspace root)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "suveryn-engine",
    "suveryn-chat",
    "suveryn-api-gateway",
]

[project.urls]
Homepage = "https://github.com/suveryn/suveryn-core"
Repository = "https://github.com/suveryn/suveryn-core"
Documentation = "https://github.com/suveryn/suveryn-docs"

[tool.uv.workspace]
members = ["packages/engine", "packages/chat", "packages/api-gateway", "packages/rag"]

[tool.uv.sources]
suveryn-engine = { workspace = true }
suveryn-chat = { workspace = true }
suveryn-api-gateway = { workspace = true }
suveryn-rag = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "anyio>=4.6",
    "reportlab>=4.0",
    "pdf2image>=1.17",
]

[tool.pytest.ini_options]
testpaths = ["packages/engine/tests", "packages/chat/tests", "packages/api-gateway/tests", "packages/rag/tests"]
addopts = "-q"
