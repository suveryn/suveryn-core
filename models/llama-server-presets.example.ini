; Example presets for llama-server in router mode, so people can choose the model per conversation
; (GET /v1/models, ChatRequest.model). Start it with:
;   llama-server --models-preset this.ini --models-max 1 --host 127.0.0.1 --port 8080
; --models-max 1: a 24 GB card holds one of these models at a time; choosing another one unloads the
; current one when its answers finish (measured on an RTX 4090: ~5 s when the file is in the page
; cache, 26-32 s from a network volume). Section names are the model ids the chat UI shows; the
; gateway's default model (SUVERYN_LLM_DEFAULT_MODEL) must be one of them. Paths are the dev pod's;
; on an appliance, suveryn-appliance writes this file. Model sources and checksums: manifest.json.
[*]
n-gpu-layers = 99
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0
parallel = 4
kv-unified = true
ctx-size = 65536
cache-ram = 32768

[qwen3.8-27b]
model = /workspace/suveryn-dev/models/Qwen3.8-27B-UD-Q4_K_M.gguf
jinja = true
chat-template-kwargs = {"enable_thinking":false}
load-on-startup = true

[mistral-small-3.2-24b]
model = /workspace/suveryn-dev/models/Mistral-Small-3.2-24B-Instruct-2506-Q4_K_M.gguf
